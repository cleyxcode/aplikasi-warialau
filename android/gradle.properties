# 11GB RAM machine with no swap — keep heap well below available memory
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
kotlin.daemon.jvmoptions=-Xmx1G
android.useAndroidX=true
android.enableJetifier=true
